<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hindi Beat MP3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050505;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
  position:relative;
}

.bg1{
  position:absolute;
  width:450px;
  height:450px;
  background:#ff0066;
  filter:blur(180px);
  opacity:0.2;
  border-radius:50%;
  top:-100px;
  left:-100px;
}

.bg2{
  position:absolute;
  width:450px;
  height:450px;
  background:#7d2ae8;
  filter:blur(180px);
  opacity:0.2;
  border-radius:50%;
  bottom:-100px;
  right:-100px;
}

.container{
  width:100%;
  max-width:720px;
  padding:20px;
  position:relative;
  z-index:10;
}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:28px;
  padding:50px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.logo{
  font-size:48px;
  font-weight:700;
  margin-bottom:10px;
  background:linear-gradient(45deg,#ff0066,#7d2ae8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  color:#bdbdbd;
  margin-bottom:40px;
}

.input-group{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.input-group input{
  flex:1;
  padding:18px;
  border:none;
  outline:none;
  border-radius:15px;
  background:#111;
  color:white;
  font-size:15px;
  border:1px solid rgba(255,255,255,0.08);
}

.input-group button{
  padding:18px 28px;
  border:none;
  border-radius:15px;
  background:linear-gradient(45deg,#ff0066,#7d2ae8);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.input-group button:hover{
  transform:scale(1.05);
}

.loading-box{
  display:none;
  margin-top:35px;
  animation:fade 0.5s ease;
}

.loading-text{
  margin-bottom:20px;
  color:#d8d8d8;
}

.progress{
  width:100%;
  height:12px;
  background:#1a1a1a;
  border-radius:30px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(45deg,#ff0066,#7d2ae8);
  border-radius:30px;
  transition:0.3s;
}

.download-box{
  display:none;
  margin-top:35px;
  animation:fade 0.5s ease;
}

.download-btn{
  display:inline-block;
  padding:16px 28px;
  border-radius:14px;
  background:linear-gradient(45deg,#00c853,#00e676);
  color:white;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}

.download-btn:hover{
  transform:scale(1.05);
}

.features{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
  margin-top:35px;
}

.feature{
  padding:12px 18px;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.05);
  color:#ccc;
  font-size:14px;
}

.footer{
  margin-top:40px;
  color:#666;
  font-size:13px;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:700px){

  .card{
    padding:35px 25px;
  }

  .logo{
    font-size:36px;
  }

  .input-group{
    flex-direction:column;
  }

  .input-group button{
    width:100%;
  }

}

</style>
</head>
<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="container">

  <div class="card">

    <div class="logo">Hindi Beat MP3</div>

    <div class="subtitle">
      Convert YouTube videos into MP3 with fast high quality downloads.
    </div>

    <div class="input-group">

      <input 
        type="text"
        id="youtubeLink"
        placeholder="Paste YouTube video URL..."
      >

      <button onclick="startConversion()">
        Convert MP3
      </button>

    </div>

    <!-- Loading -->
    <div class="loading-box" id="loadingBox">

      <div class="loading-text" id="loadingText">
        Converting your video...
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

    </div>

    <!-- Download -->
    <div class="download-box" id="downloadBox">

      <div style="margin-bottom:20px; color:#cfcfcf;">
        MP3 conversion completed successfully.
      </div>

      <a href="#" class="download-btn" download>
        Download MP3
      </a>

    </div>

    <div class="features">

      <div class="feature">320kbps Audio</div>
      <div class="feature">Fast Conversion</div>
      <div class="feature">Unlimited Downloads</div>

    </div>

    <div class="footer">
      © 2026 Hindi Beat MP3
    </div>

  </div>

</div>

<script>

function startConversion(){

  const link = document.getElementById("youtubeLink").value;

  if(link === ""){
    alert("Please paste a YouTube link.");
    return;
  }

  const loadingBox = document.getElementById("loadingBox");
  const progressBar = document.getElementById("progressBar");
  const downloadBox = document.getElementById("downloadBox");
  const loadingText = document.getElementById("loadingText");

  loadingBox.style.display = "block";
  downloadBox.style.display = "none";

  let progress = 0;

  const interval = setInterval(() => {

    progress += 10;

    progressBar.style.width = progress + "%";

    if(progress < 40){
      loadingText.innerText = "Analyzing video...";
    }
    else if(progress < 80){
      loadingText.innerText = "Converting to MP3...";
    }
    else{
      loadingText.innerText = "Preparing download...";
    }

    if(progress >= 100){

      clearInterval(interval);

      setTimeout(() => {

        loadingBox.style.display = "none";
        downloadBox.style.display = "block";

      }, 500);

    }

  }, 400);

}

</script>

</body>
</html>
